<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | الوادي التراجمة ريفي رفاعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f14;--soft:#111820;--srf:#161f2a;--srf2:#1c2733;--srf3:#24323f;
  --txt:#e8ecef;--muted:#93a3b2;--dim:#6b7b8a;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.04);
  --gold:#f2b84b;--gold2:#ffd98a;--goldD:#b57e1f;--gold-ink:#ffd98a;
  --blue:#2e5bff;--blue2:#7c9bff;--green:#35e08d;--red:#ff5c5c;--amber:#ffb020;
  --df:"Changa",sans-serif;--bf:"IBM Plex Sans Arabic",sans-serif;
  --r:16px;--sh:0 8px 32px rgba(0,0,0,.4);--sh2:0 16px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--bf);background:var(--bg);color:var(--txt);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{font-family:var(--df);line-height:1.3}
input:focus,select:focus,textarea:focus{outline:none}
body::before{content:"";position:fixed;inset:0;background:
  radial-gradient(800px 500px at 15% -10%,rgba(242,184,75,.08),transparent 60%),
  radial-gradient(600px 400px at 110% 10%,rgba(46,91,255,.08),transparent 60%);
  pointer-events:none;z-index:0}

/* الدخول */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;z-index:1;overflow-y:auto}
.login-card{background:linear-gradient(160deg,var(--srf),var(--srf2));padding:40px 34px;border-radius:24px;box-shadow:var(--sh2);width:100%;max-width:420px;border:1px solid var(--line);position:relative;overflow:hidden}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold) 0 33%,var(--blue) 33% 66%,var(--gold) 66% 100%)}
.login-logo{width:72px;height:80px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),var(--goldD));border-radius:18px;box-shadow:0 12px 32px rgba(242,184,75,.3);color:#0a0f14;font-family:var(--df);font-weight:800;font-size:1.4rem}
.login-card h1{font-size:1.5rem;margin-bottom:6px;text-align:center}
.login-card p{color:var(--muted);font-size:.88rem;margin-bottom:26px;text-align:center}

/* الحقول */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:6px;letter-spacing:.3px}
.fld input,.fld select,.fld textarea{width:100%;padding:12px 14px;background:var(--soft);border:1.5px solid var(--line);border-radius:11px;font-size:.9rem;transition:.2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold);background:var(--srf);box-shadow:0 0 0 4px rgba(242,184,75,.1)}
.fld textarea{min-height:90px;resize:vertical}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.fld-row{grid-template-columns:1fr}}

/* الأزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--goldD));color:#0a0f14;padding:12px 24px;border-radius:12px;font-family:var(--df);font-weight:700;font-size:.92rem;box-shadow:0 8px 24px rgba(242,184,75,.3);transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(242,184,75,.4)}
.btn.full{width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-ink);background:rgba(242,184,75,.06)}
.btn.sm{padding:8px 16px;font-size:.82rem;min-height:38px;border-radius:10px}
.btn.danger{background:linear-gradient(135deg,var(--red),#c2410c);color:#fff;box-shadow:none}

/* التطبيق */
.app{display:grid;grid-template-columns:260px 1fr;height:100vh;position:relative;z-index:1}
.sidebar{background:var(--srf);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.sb-head{padding:20px 18px;border-bottom:1px solid var(--line)}
.sb-brand{display:flex;align-items:center;gap:11px}
.sb-logo{width:42px;height:46px;border-radius:11px;background:linear-gradient(145deg,var(--gold),var(--goldD));display:grid;place-items:center;color:#0a0f14;font-family:var(--df);font-weight:800;font-size:.95rem;box-shadow:0 6px 16px rgba(242,184,75,.3);flex-shrink:0}
.sb-brand b{font-family:var(--df);font-size:1rem;display:block;line-height:1.2}
.sb-brand small{color:var(--gold-ink);font-size:.7rem;font-weight:600}
.sb-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.sb-nav .group{font-size:.66rem;color:var(--dim);font-weight:700;letter-spacing:1px;padding:12px 12px 5px}
.sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.88rem;text-decoration:none;position:relative;transition:.2s}
.sb-nav a:hover{background:var(--srf2);color:var(--txt)}
.sb-nav a.on{background:linear-gradient(90deg,rgba(242,184,75,.15),rgba(46,91,255,.05));color:var(--gold-ink)}
.sb-nav a.on::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;background:linear-gradient(180deg,var(--gold),var(--blue));border-radius:3px}
.sb-nav a i{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--srf2);font-style:normal;font-size:.95rem}
.sb-nav a.on i{background:linear-gradient(135deg,var(--gold),var(--goldD));color:#0a0f14}
.sb-foot{padding:14px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sb-foot .usr{flex:1;min-width:0}
.sb-foot .usr b{display:block;font-size:.86rem;font-family:var(--df)}
.sb-foot .usr small{color:var(--dim);font-size:.7rem}
.sb-foot .usr-ic{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}

.main{overflow-y:auto;display:flex;flex-direction:column}
.top{background:var(--srf);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}
.top h2{font-size:1.15rem}
.mode{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;font-size:.72rem;font-weight:700;font-family:var(--df)}
.mode.local{background:rgba(124,155,255,.14);color:var(--blue2);border:1px solid rgba(124,155,255,.3)}
.mode.api{background:rgba(53,224,141,.14);color:var(--green);border:1px solid rgba(53,224,141,.3)}
.mode::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blip 1.6s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.3}}
.content{padding:24px 26px;flex:1}

/* الإحصائيات */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.stat{background:linear-gradient(145deg,var(--srf),var(--srf2));border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;transition:.2s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:rgba(242,184,75,.25)}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--blue))}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stat-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;background:rgba(242,184,75,.14);color:var(--gold-ink)}
.stat b{display:block;font-family:var(--df);font-size:2rem;font-weight:800;line-height:1}
.stat small{color:var(--muted);font-size:.76rem;display:block;margin-top:4px}

.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.qbtn{background:linear-gradient(145deg,var(--srf),var(--srf2));border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;transition:.2s;color:var(--txt);font-family:var(--df);font-weight:700;font-size:.9rem;text-align:start}
.qbtn:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--sh)}
.qbtn i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:1.15rem;font-style:normal;flex-shrink:0}
.qbtn.g i{background:rgba(242,184,75,.16);color:var(--gold-ink)}
.qbtn.b i{background:rgba(46,91,255,.16);color:var(--blue2)}
.qbtn.gr i{background:rgba(53,224,141,.16);color:var(--green)}
.qbtn.r i{background:rgba(255,92,92,.16);color:var(--red)}

.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.sec-head h3{font-size:1.15rem;display:flex;align-items:center;gap:10px}
.count{font-size:.72rem;font-weight:700;background:var(--srf2);color:var(--gold-ink);padding:3px 10px;border-radius:100px;border:1px solid rgba(242,184,75,.25)}

/* القوائم */
.list{display:grid;gap:10px}
.it{background:var(--srf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:.2s}
.it:hover{border-color:rgba(255,255,255,.14);background:var(--srf2)}
.it-ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,rgba(242,184,75,.15),rgba(46,91,255,.08));display:grid;place-items:center;font-size:1.1rem;flex-shrink:0;overflow:hidden}
.it-ic img{width:100%;height:100%;object-fit:cover}
.it-bd{flex:1;min-width:0}
.it-bd b{font-family:var(--df);font-size:.95rem;display:block}
.it-bd small{color:var(--muted);font-size:.76rem;display:block;margin-top:2px}
.it-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:100px;font-family:var(--df)}
.tag.gold{background:rgba(242,184,75,.14);color:var(--gold-ink);border:1px solid rgba(242,184,75,.3)}
.tag.blue{background:rgba(46,91,255,.14);color:var(--blue2);border:1px solid rgba(46,91,255,.3)}
.tag.green{background:rgba(53,224,141,.14);color:var(--green);border:1px solid rgba(53,224,141,.3)}
.tag.red{background:rgba(255,92,92,.14);color:var(--red);border:1px solid rgba(255,92,92,.3)}
.tag.amber{background:rgba(255,176,32,.14);color:var(--amber);border:1px solid rgba(255,176,32,.3)}
.it-acts{display:flex;gap:5px}
.it-acts button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;transition:.2s;font-size:.9rem}
.it-acts .e{background:rgba(46,91,255,.12);color:var(--blue2)}
.it-acts .e:hover{background:var(--blue);color:#fff}
.it-acts .d{background:rgba(255,92,92,.12);color:var(--red)}
.it-acts .d:hover{background:var(--red);color:#fff}

/* المودال */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;place-items:center;z-index:100;padding:16px;overflow-y:auto}
.modal.on{display:grid}
.modal-box{background:linear-gradient(160deg,var(--srf),var(--srf2));border:1px solid var(--line);border-radius:20px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:var(--sh2)}
.modal-box.lg{max-width:940px}
.modal-box h3{font-size:1.25rem;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.modal-box h3::before{content:"";width:4px;height:22px;background:linear-gradient(180deg,var(--gold),var(--blue));border-radius:3px}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.m-sec{margin-top:16px}
.m-sec>label{display:block;font-size:.82rem;color:var(--gold-ink);font-weight:700;margin-bottom:8px;font-family:var(--df)}

/* صفوف المحررات (أوسمة/أهداف/خصم) */
.rows{display:grid;gap:6px}
.rows .r{display:flex;gap:6px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:6px 8px;flex-wrap:wrap}
.rows select,.rows input{background:var(--srf);border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:.82rem}
.rows select:focus,.rows input:focus{border-color:var(--gold)}
.rows .tm{width:86px;font-family:var(--df);font-weight:700}
.rows .pl{flex:1;min-width:120px}
.rows .mi{width:76px}
.rows .n{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-size:.7rem;font-family:var(--df);font-weight:700;flex-shrink:0}
.rows .x{width:28px;height:28px;border-radius:7px;background:rgba(255,92,92,.12);color:var(--red);flex-shrink:0}
.rows .x:hover{background:var(--red);color:#fff}

/* محرر التشكيلة */
.lu-editor{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}
@media(max-width:760px){.lu-editor{grid-template-columns:1fr}}
.lu-side{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:440px;overflow-y:auto}
.lu-group{margin-bottom:12px}
.lu-group-title{display:flex;align-items:center;gap:8px;font-family:var(--df);font-weight:700;font-size:.85rem;color:var(--gold-ink);margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.lu-group-title::before{content:"";width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--gold),var(--goldD))}
.lu-group-title .n{margin-inline-start:auto;font-size:.68rem;background:var(--srf3);padding:2px 8px;border-radius:100px;color:var(--muted)}
.lu-player{display:flex;align-items:center;gap:10px;padding:7px 9px;background:var(--srf);border:1px solid var(--line);border-radius:9px;margin-bottom:5px;cursor:pointer;transition:.2s}
.lu-player:hover{border-color:var(--gold)}
.lu-player.in{background:linear-gradient(135deg,rgba(242,184,75,.15),rgba(46,91,255,.08));border-color:rgba(242,184,75,.4)}
.lu-player .num{width:26px;height:26px;border-radius:8px;background:var(--srf2);display:grid;place-items:center;font-family:var(--df);font-weight:800;font-size:.72rem;flex-shrink:0}
.lu-player.in .num{background:linear-gradient(135deg,var(--gold),var(--goldD));color:#0a0f14}
.lu-player .nm{flex:1;font-size:.82rem;min-width:0}
.lu-player .nm b{display:block;font-family:var(--df);font-weight:700}
.lu-player .nm small{color:var(--muted);font-size:.7rem}
.lu-player .x{width:22px;height:22px;border-radius:6px;background:rgba(255,92,92,.14);color:var(--red);display:grid;place-items:center;font-size:.7rem;opacity:0;transition:.2s}
.lu-player.in .x{opacity:1}

.pitch-mini{position:relative;width:100%;aspect-ratio:.85/1;margin:0 auto;
  clip-path:polygon(14% 0,86% 0,100% 100%,0 100%);
  background:
    radial-gradient(circle at 50% 50%,transparent 26px,rgba(255,255,255,.3) 26px 28px,transparent 29px),
    linear-gradient(180deg,transparent 49%,rgba(255,255,255,.3) 49% 51%,transparent 51%),
    repeating-linear-gradient(0deg,#1e8049 0 28px,#187040 28px 56px);
  box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:hidden}
.pitch-mini::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 28%,transparent 72%,rgba(0,0,0,.22));pointer-events:none}
.pitch-mini-in{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:5% 4%}
.pm-row{display:flex;justify-content:center;gap:3%;margin:0 auto}
.pm-row.r1{width:56%}.pm-row.r2{width:70%}.pm-row.r3{width:86%}.pm-row.r4{width:34%}
.pm-p{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;max-width:68px}
.pm-p .jsy{width:100%;max-width:38px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.pm-p span{color:#fff;font-size:.55rem;font-weight:700;text-align:center;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.pm-row.r1 .pm-p{transform:scale(.85)}.pm-row.r2 .pm-p{transform:scale(.92)}
.pm-row.r4 .pm-p .jsy{max-width:42px}
.pm-empty{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.6);font-size:.8rem;text-align:center;padding:20px;text-shadow:0 2px 8px rgba(0,0,0,.6)}

/* صور مصغرة */
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;inset-inline-end:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:.65rem;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.img-preview{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:8px;border:1px solid var(--line)}

/* الرسائل */
.msg{background:var(--srf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.msg.read{opacity:.55}
.msg .head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.msg .head b{font-family:var(--df);font-size:.92rem}
.msg .head time{font-size:.72rem;color:var(--dim)}
.msg p{font-size:.86rem;line-height:1.6}
.msg .meta{font-size:.74rem;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.msg .acts{margin-top:10px;display:flex;gap:6px}

.empty{text-align:center;padding:50px 20px;color:var(--muted);background:var(--srf);border:1px dashed var(--line);border-radius:var(--r)}
.empty i{font-size:3rem;display:block;margin-bottom:10px;opacity:.5}
.empty h3{font-size:1.05rem;color:var(--txt);margin-bottom:4px}
.empty p{font-size:.84rem}

.set-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:800px){.set-grid{grid-template-columns:1fr 1fr}}
.set-card{background:var(--srf);border:1px solid var(--line);border-radius:16px;padding:20px}
.set-card h4{font-family:var(--df);font-size:1rem;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--gold-ink)}
.set-card h4::before{content:"";width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--gold),var(--goldD))}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(140%);background:linear-gradient(135deg,var(--srf),var(--srf2));border:1px solid var(--line);color:var(--txt);padding:12px 24px;border-radius:100px;font-size:.88rem;font-family:var(--df);box-shadow:var(--sh2);z-index:200;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(53,224,141,.4)}
.toast.err{border-color:rgba(255,92,92,.4)}

.menu-btn{display:none;width:40px;height:40px;border-radius:10px;background:var(--srf);border:1px solid var(--line);place-items:center;font-size:1.1rem;color:var(--txt)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.backdrop.on{display:block}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset-inline-end:0;top:0;bottom:0;width:280px;z-index:50;transform:translateX(105%);transition:transform .3s}
  .sidebar.on{transform:translateX(0)}
  .menu-btn{display:grid}
}
</style>
</head>
<body>

<div class="login" id="loginView">
  <div class="login-card">
    <div class="login-logo">و</div>
    <h1>الوادي التراجمة</h1>
    <p>لوحة التحكم — إدارة الموقع والمحتوى</p>
    <div class="fld"><label>اسم المستخدم</label><input type="text" id="username" value="admin" autocomplete="username"></div>
    <div class="fld"><label>كلمة المرور</label><input type="password" id="password" autocomplete="current-password"></div>
    <button class="btn full" id="loginBtn">🔓 دخول</button>
  </div>
</div>

<script>
(function(){
"use strict";
var API="/api",KEY="wadi_data_v2",TOKEN=localStorage.getItem("wadi_token")||"";
var C=null,MODE="",POS=["حارس مرمى","مدافع","وسط","مهاجم"];
var SECTIONS=[
  {g:"الرئيسية",items:[["dash","📊","لوحة القيادة"]]},
  {g:"المحتوى",items:[["players","👥","اللاعبون"],["matches","⚽","المباريات"],["news","📰","الأخبار"]]},
  {g:"النادي",items:[["board","🧑‍","الإدارة"],["honors","🏅","سجل الشرف"],["messages","✉️","الرسائل"]]},
  {g:"النظام",items:[["settings","⚙️","الإعدادات"]]}
];

function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m,type){var t=$("#toast");t.textContent=m;t.className="toast on "+(type||"ok");setTimeout(function(){t.className="toast"},3000)}
function localPass(){return localStorage.getItem("wadi_pass")||"wadi2026"}

function DEFAULT(){return{settings:{name:"الوادي التراجمة",region:"ريفي رفاعة",motto:"من قلب الوادي.. نلعب باسم الديار",about:"نادي الوادي التراجمة ريفي رفاعة ممثل منطقة التراجمة في منافسات اتحاد رفاعة المحلي لكرة القدم ضمن دوري الدرجة الثانية.",defaultXI:[],f1:{name:"ميدان الوادي",map:"https://maps.app.goo.gl/5omSxgEUMPaeguno7"},f2:{name:"ميدان الهاشماب",map:"https://maps.app.goo.gl/NQ5eu8AeUwTmhckv6?g_st=ac"},social:{fb:"",wa:"",yt:"",ig:"",tt:""}},players:[],matches:[],news:[],board:[],honors:[],messages:[]}}

/* تطبيع موحّد — يُستخدم محليًا وبعد جلب API حتى لا تنهار الإعدادات في الوضع المتصل */
function normC(){
  ["players","matches","news","board","honors","messages"].forEach(function(k){if(!Array.isArray(C[k]))C[k]=[]});
  C.settings=C.settings||DEFAULT().settings;
  if(!C.settings.social)C.settings.social={fb:"",wa:"",yt:"",ig:"",tt:""};
  if(!Array.isArray(C.settings.defaultXI))C.settings.defaultXI=[];
  if(!C.settings.f1)C.settings.f1={name:"ميدان الوادي",map:""};
  if(!C.settings.f2)C.settings.f2={name:"ميدان الهاشماب",map:""};
  C.matches.forEach(function(m){if(!Array.isArray(m.lineup))m.lineup=[];if(!Array.isArray(m.oppLineup))m.oppLineup=[];if(!Array.isArray(m.goals))m.goals=[]});
  C.news.forEach(function(n){if(!Array.isArray(n.imgs))n.imgs=n.img?[n.img]:[]});
  C.players.forEach(function(p){if(!Array.isArray(p.medals))p.medals=[]});
}
function loadLocal(){
  try{var r=localStorage.getItem(KEY);C=r?JSON.parse(r):DEFAULT()}catch(e){C=DEFAULT()}
  normC();
}
/* حفظ صادق: يلتقط امتلاء المتصفح، ويتحقق من نجاح الخادم فعلًا */
function save(){
  var lok=true;
  try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){lok=false}
  if(MODE==="api"){
    fetch(API+"/admin",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:JSON.stringify(C)})
      .then(function(r){
        if(r.status===401){toast("❌ انتهت الجلسة — أعد تسجيل الدخول","err");return}
        if(r.status===413){toast("❌ المحتوى أكبر من حد الخادم — قلّل الصور","err");return}
        if(!r.ok)throw 0;
        toast(lok?"✅ تم الحفظ (سحابي + محلي)":"✅ تم الحفظ سحابيًا (تعذر الحفظ المحلي)","ok");
      })
      .catch(function(){toast(lok?"⚠️ حُفظ محليًا فقط — الخادم غير متاح":"❌ تعذر الحفظ — لا محليًا ولا سحابيًا","err")});
  }else toast(lok?"✅ تم الحفظ":"❌ تعذر الحفظ — مساحة المتصفح ممتلئة",lok?"ok":"err");
}

/* الصور: في الوضع المتصل تُرفع إلى R2 عبر /api/upload الموجود، وإلا ضغط محلي */
function compress(file,cb){
  if(MODE==="api"&&TOKEN){
    var fd=new FormData();fd.append("file",file);
    fetch(API+"/upload",{method:"POST",headers:{"Authorization":"Bearer "+TOKEN},body:fd})
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(d){if(d&&d.url)cb(d.url);else throw 0})
      .catch(function(){compressLocal(file,cb)});
    return;
  }
  compressLocal(file,cb);
}
function compressLocal(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=700,w=img.width,h=img.height;
      if(w>max){h=Math.round(h*max/w);w=max}
      var c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/jpeg",.8));
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

function calcGoals(){
  var g={};C.players.forEach(function(p){g[p.id]=0});
  C.matches.forEach(function(m){if(m.status==="finished")(m.goals||[]).forEach(function(x){if(x.team==="my"&&x.pid&&g[x.pid]!==undefined)g[x.pid]++})});
  return g;
}

/* ===== الدخول ===== */
function enter(mode,user){
  MODE=mode;
  $("#loginView").style.display="none";
  $("#appView").style.display="grid";
  $("#userName").textContent=user||"admin";
  $("#usrIc").textContent=(user||"A").charAt(0).toUpperCase();
  $("#modeTag").textContent=mode==="api"?"متصل":"محلي";
  $("#modeTag").className="mode "+(mode==="api"?"api":"local");
  $("#modeSmall").textContent=mode==="api"?"وضع متصل":"وضع محلي";
  buildSidebar();go("dash");
}
function login(){
  var u=$("#username").value.trim()||"admin",p=$("#password").value;
  fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})})
    .then(function(r){
      if(r.status===404||r.status===500||r.status===405||r.status===403)throw{net:true};
      if(r.status===429)throw{net:false,many:true};
      if(r.status===503)throw{net:false,cfg:true};
      if(!r.ok)throw{net:false};
      return r.json();
    })
    .then(function(r){
      TOKEN=r.token;localStorage.setItem("wadi_token",TOKEN);localStorage.setItem("wadi_user",r.username||u);
      fetch(API+"/admin",{headers:{"Authorization":"Bearer "+TOKEN}}).then(function(x){return x.json()}).then(function(d){
        C=d.content||DEFAULT();
        normC();
        enter("api",r.username||u);
      });
    })
    .catch(function(err){
      if(err&&err.net){
        if(p===localPass()){loadLocal();enter("local",u)}
        else toast("❌ كلمة المرور خاطئة","err");
      }else if(err&&err.many)toast("❌ محاولات كثيرة — انتظر قليلًا","err");
      else if(err&&err.cfg)toast("❌ الخادم غير مهيأ — راجع ADMIN_PASS","err");
      else toast("❌ بيانات الدخول خاطئة","err");
    });
}
$("#loginBtn").onclick=login;
$("#password").addEventListener("keydown",function(e){if(e.key==="Enter")login()});
$("#logoutBtn").onclick=function(){
  if(MODE==="api")fetch(API+"/logout",{method:"POST",headers:{"Authorization":"Bearer "+TOKEN}}).catch(function(){});
  localStorage.removeItem("wadi_token");TOKEN="";location.reload();
};

/* ===== التنقل ===== */
function buildSidebar(){
  var h="";
  SECTIONS.forEach(function(s){
    h+='<div class="group">'+s.g+'</div>';
    s.items.forEach(function(it){h+='<a href="#" data-sec="'+it[0]+'"><i>'+it[1]+'</i>'+it[2]+'</a>'});
  });
  $("#sbNav").innerHTML=h;
  $$("#sbNav a").forEach(function(a){a.onclick=function(e){e.preventDefault();go(a.dataset.sec)}});
}
var PAGE_TITLES={dash:"لوحة القيادة",players:"اللاعبون",matches:"المباريات والنتائج",news:"أخبار النادي",board:"إدارة النادي",honors:"سجل الشرف",messages:"الرسائل الواردة",settings:"الإعدادات"};
function go(sec){
  $$("#sbNav a").forEach(function(a){a.classList.toggle("on",a.dataset.sec===sec)});
  $("#pageTitle").textContent=PAGE_TITLES[sec]||"لوحة التحكم";
  $("#sidebar").classList.remove("on");$("#backdrop").classList.remove("on");
  ({dash:dash,players:players,matches:matches,news:news,board:board,honors:honors,messages:messages,settings:settings})[sec]();
}
$("#menuBtn").onclick=function(){$("#sidebar").classList.add("on");$("#backdrop").classList.add("on")};
$("#backdrop").onclick=function(){$("#sidebar").classList.remove("on");$("#backdrop").classList.remove("on")};

/* ===== لوحة القيادة ===== */
function dash(){
  var up=C.matches.filter(function(m){return m.status==="upcoming"}).length;
  var fin=C.matches.filter(function(m){return m.status==="finished"}).length;
  var unread=C.messages.filter(function(m){return !m.read}).length;
  var last=C.matches.filter(function(m){return m.status==="finished"}).sort(function(a,b){return new Date(b.date)-new Date(a.date)})[0];
  var nxt=C.matches.filter(function(m){return m.status==="upcoming"&&new Date(m.date)>new Date()}).sort(function(a,b){return new Date(a.date)-new Date(b.date)})[0];
  $("#content").innerHTML=
    '<div class="stats">'+
    '<div class="stat"><div class="stat-top"><div class="stat-ic">👥</div></div><b>'+C.players.length+'</b><small>لاعب مسجل</small></div>'+
    '<div class="stat"><div class="stat-top"><div class="stat-ic">⚽</div></div><b>'+fin+'</b><small>مباراة منتهية</small></div>'+
    '<div class="stat"><div class="stat-top"><div class="stat-ic">📅</div></div><b>'+up+'</b><small>مباراة قادمة</small></div>'+
    '<div class="stat"><div class="stat-top"><div class="stat-ic">📰</div></div><b>'+C.news.length+'</b><small>خبر منشور</small></div>'+
    '<div class="stat"><div class="stat-top"><div class="stat-ic">🧑‍</div></div><b>'+C.board.length+'</b><small>عضو إدارة</small></div>'+
    '<div class="stat"><div class="stat-top"><div class="stat-ic">✉️</div></div><b>'+unread+'</b><small>رسائل جديدة</small></div></div>'+
    '<div class="quick-grid">'+
    '<button class="qbtn g" data-q="players"><i>👥</i>إضافة لاعب</button>'+
    '<button class="qbtn b" data-q="matches"><i>⚽</i>إضافة مباراة</button>'+
    '<button class="qbtn gr" data-q="news"><i>📰</i>إضافة خبر</button>'+
    '<button class="qbtn r" data-q="board"><i>🧑‍</i>إضافة إداري</button></div>'+
    '<div class="set-grid">'+
    '<div class="set-card"><h4>🔥 آخر نتيجة</h4>'+(last?'<div style="font-family:var(--df);font-size:1.15rem;font-weight:800">'+esc(C.settings.name)+' <span style="color:var(--gold-ink)">'+last.my+' – '+last.op+'</span> '+esc(last.opponent)+'</div><div style="color:var(--muted);font-size:.78rem;margin-top:4px">'+new Date(last.date).toLocaleDateString("ar")+' • '+esc(last.venue)+'</div>':'<div style="color:var(--dim);font-size:.85rem">لا نتائج مسجلة بعد</div>')+'</div>'+
    '<div class="set-card"><h4>⏰ المباراة القادمة</h4>'+(nxt?'<div style="font-family:var(--df);font-size:1.05rem;font-weight:700">ضد '+esc(nxt.opponent)+'</div><div style="color:var(--muted);font-size:.78rem;margin-top:4px">📅 '+new Date(nxt.date).toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long"})+' • ⏰ '+new Date(nxt.date).toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"})+'</div><div style="color:var(--muted);font-size:.78rem">📍 '+esc(nxt.venue)+'</div>':'<div style="color:var(--dim);font-size:.85rem">لا مباريات قادمة</div>')+'</div></div>';
  $$("#content [data-q]").forEach(function(b){
    b.onclick=function(){
      var sec=b.dataset.q;
      go(sec);
      setTimeout(function(){
        if(sec==="players")openPlayer(-1);
        else if(sec==="matches")openMatch(-1);
        else if(sec==="news")openNews(-1);
        else openBoard(-1);
      },60);
    };
  });
}

/* ===== اللاعبون ===== */
function players(){
  $("#content").innerHTML='<div class="sec-head"><h3>قائمة اللاعبين <span class="count">'+C.players.length+'</span></h3><button class="btn" id="addP">➕ إضافة لاعب</button></div><div class="list" id="list"></div>';
  $("#addP").onclick=function(){openPlayer(-1)};
  renderPlayers();
}
function renderPlayers(){
  var g=calcGoals(),h="";
  POS.forEach(function(pos){
    var arr=[];C.players.forEach(function(p,i){if(p.pos===pos)arr.push({p:p,i:i})});
    if(!arr.length)return;
    h+='<div style="margin-bottom:6px"><h4 style="font-size:.86rem;color:var(--gold-ink);margin:10px 0 8px">'+pos+' ('+arr.length+')</h4>';
    arr.forEach(function(x){
      var p=x.p;
      h+='<div class="it"><div class="it-ic">'+(p.photo?'<img src="'+esc(p.photo)+'">':'<span>👕</span>')+'</div>'+
        '<div class="it-bd"><b>#'+esc(p.num)+' '+esc(p.name)+'</b><small>'+(p.age?p.age+' سنة':'')+(p.apps?' • '+p.apps+' مباراة':'')+'</small>'+
        '<div class="it-tags"><span class="tag gold">⚽ '+((g[p.id])||0)+' أهداف</span>'+((p.medals||[]).length?'<span class="tag amber">🏅 '+(p.medals.length)+' وسام</span>':"")+'</div></div>'+
        '<div class="it-acts"><button class="e" data-e="'+x.i+'">✏️</button><button class="d" data-d="'+x.i+'">🗑️</button></div></div>';
    });
    h+='</div>';
  });
  $("#list").innerHTML=h||'<div class="empty"><i>👥</i><h3>لا لاعبون بعد</h3><p>ابدأ بإضافة لاعبي الفريق</p></div>';
  $$("#list [data-e]").forEach(function(b){b.onclick=function(){openPlayer(+b.dataset.e)}});
  $$("#list [data-d]").forEach(function(b){b.onclick=function(){if(confirm("حذف اللاعب؟")){C.players.splice(+b.dataset.d,1);save();renderPlayers()}}});
}
var TMP={photo:""};
function medalRow(m){
  m=m||{t:"gold",label:""};
  return '<div class="r"><select class="m-t"><option value="gold"'+(m.t==="gold"?" selected":"")+'>🥇 ذهبية</option><option value="silver"'+(m.t==="silver"?" selected":"")+'>🥈 فضية</option><option value="bronze"'+(m.t==="bronze"?" selected":"")+'>🥉 برونزية</option></select><input class="m-l" placeholder="مثال: هداف الجولة 3 / أفضل لاعب" value="'+esc(m.label)+'"><button type="button" class="x">✕</button></div>';
}
function openPlayer(i){
  var p=i>=0?C.players[i]:{name:"",num:"",age:"",pos:"مهاجم",apps:0,photo:"",medals:[]};
  TMP.photo=p.photo||"";
  $("#modalBox").className="modal-box";
  $("#modalBox").innerHTML='<h3>'+(i>=0?"تعديل":"إضافة")+' لاعب</h3>'+
    '<div class="fld"><label>الاسم الكامل</label><input id="pName" value="'+esc(p.name)+'" placeholder="مثال: أحمد الطيب"></div>'+
    '<div class="fld-row"><div class="fld"><label>رقم القميص</label><input id="pNum" type="number" value="'+esc(p.num)+'"></div><div class="fld"><label>العمر</label><input id="pAge" type="number" value="'+esc(p.age||"")+'"></div></div>'+
    '<div class="fld-row"><div class="fld"><label>الخانة</label><select id="pPos">'+POS.map(function(x){return '<option'+(p.pos===x?' selected':'')+'>'+x+'</option>'}).join("")+'</select></div><div class="fld"><label>عدد المباريات</label><input id="pApps" type="number" value="'+(p.apps||0)+'"></div></div>'+
    '<div class="fld"><label>صورة اللاعب</label><input type="file" id="pFile" accept="image/*">'+(TMP.photo?'<img class="img-preview" id="pPrev" src="'+esc(TMP.photo)+'">':'<img class="img-preview" id="pPrev" style="display:none">')+'<button class="btn sm ghost" id="pRm" type="button" style="margin-top:8px">🗑️ إزالة الصورة</button></div>'+
    '<div class="m-sec"><label>🏅 الأوسمة والميداليات</label><div class="rows" id="mdRows">'+(p.medals||[]).map(medalRow).join("")+'</div><button class="btn sm ghost" id="mdAdd" type="button" style="margin-top:6px">➕ إضافة وسام</button></div>'+
    '<div class="modal-acts"><button class="btn ghost" id="mX">إلغاء</button><button class="btn" id="mS">💾 حفظ</button></div>';
  $("#modal").classList.add("on");
  $("#pFile").onchange=function(){var f=this.files[0];if(!f)return;compress(f,function(d){TMP.photo=d;$("#pPrev").src=d;$("#pPrev").style.display="block"})};
  $("#pRm").onclick=function(){TMP.photo="";$("#pPrev").style.display="none"};
  $("#mdAdd").onclick=function(){$("#mdRows").insertAdjacentHTML("beforeend",medalRow());bindMd()};
  function bindMd(){$$("#mdRows .x").forEach(function(b){b.onclick=function(){b.closest(".r").remove()}})}
  bindMd();
  $("#mX").onclick=closeModal;
  $("#mS").onclick=function(){
    var medals=$$("#mdRows .r").map(function(r){return{t:r.querySelector(".m-t").value,label:r.querySelector(".m-l").value.trim()}}).filter(function(m){return m.label});
    var o={id:i>=0?C.players[i].id:Date.now(),name:$("#pName").value.trim(),num:+$("#pNum").value||0,age:+$("#pAge").value||0,pos:$("#pPos").value,apps:+$("#pApps").value||0,photo:TMP.photo,medals:medals};
    if(!o.name){toast("❌ أدخل الاسم","err");return}
    if(i>=0)C.players[i]=o;else C.players.push(o);
    save();closeModal();renderPlayers();
  };
}

/* ===== المباريات ===== */
function matches(){
  $("#content").innerHTML='<div class="sec-head"><h3>جميع المباريات <span class="count">'+C.matches.length+'</span></h3><button class="btn" id="addM">➕ إضافة مباراة</button></div><div class="list" id="list"></div>';
  $("#addM").onclick=function(){openMatch(-1)};
  renderMatches();
}
function renderMatches(){
  var up=[],fin=[];
  C.matches.forEach(function(m,i){(m.status==="upcoming"?up:fin).push({m:m,i:i})});
  up.sort(function(a,b){return new Date(a.m.date)-new Date(b.m.date)});
  fin.sort(function(a,b){return new Date(b.m.date)-new Date(a.m.date)});
  var h="";
  if(up.length){h+='<h4 style="font-size:.86rem;color:var(--blue2);margin-bottom:8px">📅 القادمة ('+up.length+')</h4>';up.forEach(function(x){h+=matchItem(x.m,x.i)})}
  if(fin.length){h+='<h4 style="font-size:.86rem;color:var(--green);margin:16px 0 8px">✅ النتائج ('+fin.length+')</h4>';fin.forEach(function(x){h+=matchItem(x.m,x.i)})}
  $("#list").innerHTML=h||'<div class="empty"><i>⚽</i><h3>لا مباريات بعد</h3><p>ابدأ بتسجيل مباريات الفريق</p></div>';
  $$("#list [data-e]").forEach(function(b){b.onclick=function(){openMatch(+b.dataset.e)}});
  $$("#list [data-d]").forEach(function(b){b.onclick=function(){if(confirm("حذف المباراة؟")){C.matches.splice(+b.dataset.d,1);save();renderMatches()}}});
}
function matchItem(m,i){
  var fin=m.status==="finished",w=m.my>m.op,d=m.my===m.op,tags=[];
  if(m.home)tags.push('<span class="tag gold">🏠 أرضنا</span>');
  if(fin)tags.push((w?'<span class="tag green">فوز</span>':d?'<span class="tag amber">تعادل</span>':'<span class="tag red">خسارة</span>')+'<span class="tag blue">'+m.my+' – '+m.op+'</span>');
  else tags.push('<span class="tag blue">قادمة</span>');
  if((m.goals||[]).length)tags.push('<span class="tag gold">⚽ '+m.goals.length+'</span>');
  if((m.lineup||[]).length)tags.push('<span class="tag green">👥 تشكيلة</span>');
  return '<div class="it"><div class="it-ic">⚽</div><div class="it-bd"><b>'+esc(m.opponent)+'</b><small>'+esc(m.venue||"—")+' • '+new Date(m.date).toLocaleDateString("ar")+'</small><div class="it-tags">'+tags.join("")+'</div></div><div class="it-acts"><button class="e" data-e="'+i+'">✏️</button><button class="d" data-d="'+i+'">🗑️</button></div></div>';
}
function goalRow(g){
  g=g||{team:"my",pid:C.players[0]?C.players[0].id:0,name:"",min:""};
  var opts=C.players.map(function(p){return '<option value="'+p.id+'"'+(g.pid===p.id?" selected":"")+'>'+esc(p.name)+'</option>'}).join("");
  return '<div class="r"><select class="tm"><option value="my"'+(g.team==="my"?" selected":"")+'>🟢 لنا</option><option value="op"'+(g.team==="op"?" selected":"")+'>🔴 الخصم</option></select><select class="pl g-pid" style="'+(g.team==="op"?"display:none":"")+'">'+opts+'</select><input class="pl g-name" placeholder="اسم لاعب الخصم" value="'+esc(g.name||"")+'" style="'+(g.team==="my"?"display:none":"")+'"><input class="mi" type="number" placeholder="الدقيقة" value="'+esc(g.min||"")+'"><button type="button" class="x">✕</button></div>';
}
function openMatch(i){
  var m=i>=0?C.matches[i]:{opponent:"",date:"",venue:"",comp:"دوري الدرجة الثانية",home:true,status:"upcoming",my:0,op:0,lineup:[],oppLineup:[],goals:[]};
  var XI=(m.lineup||[]).slice(),OPP=(m.oppLineup||[]).slice();
  $("#modalBox").className="modal-box lg";
  $("#modalBox").innerHTML='<h3>'+(i>=0?"تعديل":"إضافة")+' مباراة</h3>'+
    '<div class="fld"><label>اسم الفريق الخصم</label><input id="mOpp" value="'+esc(m.opponent)+'" placeholder="مثال: الهلال رفاعة"></div>'+
    '<div class="fld-row"><div class="fld"><label>التاريخ والوقت</label><input id="mDate" type="datetime-local" value="'+esc(m.date)+'"></div><div class="fld"><label>الملعب</label><input id="mVenue" value="'+esc(m.venue)+'" placeholder="مثال: ميدان الوادي"></div></div>'+
    '<div class="fld-row"><div class="fld"><label>البطولة</label><input id="mComp" value="'+esc(m.comp)+'"></div><div class="fld"><label>الحالة</label><select id="mStatus"><option value="upcoming"'+(m.status==="upcoming"?" selected":"")+'>قادمة</option><option value="finished"'+(m.status==="finished"?" selected":"")+'>منتهية</option></select></div></div>'+
    '<div class="fld"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="mHome"'+(m.home?" checked":"")+' style="width:auto"> المباراة على أرضنا</label></div>'+
    '<div class="fld-row"><div class="fld"><label>أهدافنا</label><input id="mMy" type="number" value="'+(m.my||0)+'"></div><div class="fld"><label>أهداف الخصم</label><input id="mOp" type="number" value="'+(m.op||0)+'"></div></div>'+
    '<div class="m-sec"><label>🎯 تشكيلتنا (اختر 11 لاعبًا — معاينة حية)</label><div class="lu-editor"><div class="lu-side" id="luSide"></div><div><div class="pitch-mini"><div class="pitch-mini-in" id="pitchIn"></div></div></div></div></div>'+
    '<div class="m-sec"><label>👥 تشكيلة الخصم (اسم لكل لاعب)</label><div class="rows" id="opRows"></div><button class="btn sm ghost" id="opAdd" type="button" style="margin-top:6px">➕ إضافة لاعب خصم</button></div>'+
    '<div class="m-sec"><label>⚽ الأهداف والهدافون (تُضاف تلقائيًا لرصيد اللاعب)</label><div class="rows" id="glRows">'+(m.goals||[]).map(goalRow).join("")+'</div><button class="btn sm ghost" id="glAdd" type="button" style="margin-top:6px">➕ إضافة هدف</button></div>'+
    '<div class="modal-acts"><button class="btn ghost" id="mX">إلغاء</button><button class="btn" id="mS">💾 حفظ المباراة</button></div>';
  $("#modal").classList.add("on");

  function jerseySvg(num){return '<svg viewBox="0 0 44 38" class="jsy"><path d="M15 3 7 7 2 14l7 4 2-3v16h22V15l2 3 7-4-5-7-8-4c0 4-3 6-6 6s-6-2-6-6z" fill="#f2b84b" stroke="#123024" stroke-width="1.6"/><text x="22" y="28" text-anchor="middle" font-size="12" font-family="Changa" font-weight="800" fill="#123024">'+esc(num)+'</text></svg>'}
  function renderLu(){
    var byPos={};POS.forEach(function(p){byPos[p]=[]});
    C.players.forEach(function(p){if(byPos[p.pos])byPos[p.pos].push(p)});
    var h="";
    POS.forEach(function(pos){
      var cnt=XI.filter(function(id){var p=C.players.filter(function(x){return x.id===id})[0];return p&&p.pos===pos}).length;
      var max=pos==="حارس مرمى"?1:pos==="مدافع"?5:pos==="وسط"?5:3;
      h+='<div class="lu-group"><div class="lu-group-title">'+pos+' <span class="n">'+cnt+'/'+max+'</span></div>';
      byPos[pos].forEach(function(p){
        var inXi=XI.indexOf(p.id)>-1;
        h+='<div class="lu-player'+(inXi?" in":"")+'" data-pid="'+p.id+'" data-pos="'+pos+'" data-max="'+max+'"><span class="num">'+esc(p.num)+'</span><div class="nm"><b>'+esc(p.name)+'</b><small>'+(p.age?p.age+' سنة':'')+'</small></div><span class="x">'+(inXi?"✕":"")+'</span></div>';
      });
      h+='</div>';
    });
    $("#luSide").innerHTML=h||'<div style="color:var(--dim);text-align:center;padding:20px">لا لاعبون — أضفهم أولًا</div>';
    $$("#luSide .lu-player").forEach(function(el){
      el.onclick=function(){
        var pid=+el.dataset.pid,pos=el.dataset.pos,max=+el.dataset.max;
        var idx=XI.indexOf(pid);
        if(idx>-1)XI.splice(idx,1);
        else{
          var cnt=XI.filter(function(id){var p=C.players.filter(function(x){return x.id===id})[0];return p&&p.pos===pos}).length;
          if(cnt>=max){toast("❌ الحد الأقصى لـ "+pos+" هو "+max,"err");return}
          XI.push(pid);
        }
        renderLu();renderPitch();
      };
    });
  }
  function renderPitch(){
    var ps=XI.map(function(id){return C.players.filter(function(p){return p.id===id})[0]}).filter(Boolean);
    if(!ps.length){$("#pitchIn").innerHTML='<div class="pm-empty">اختر 11 لاعبًا لعرض التشكيلة على الملعب</div>';return}
    var rows=[["مهاجم","r1"],["وسط","r2"],["مدافع","r3"],["حارس مرمى","r4"]].map(function(r){return{cls:r[1],ps:ps.filter(function(p){return p.pos===r[0]})}}).filter(function(r){return r.ps.length});
    $("#pitchIn").innerHTML=rows.map(function(r){
      return '<div class="pm-row '+r.cls+'">'+r.ps.map(function(p){return '<div class="pm-p">'+jerseySvg(p.num)+'<span>'+esc(p.name.split(" ")[0])+'</span></div>'}).join("")+'</div>';
    }).join("");
  }
  function renderOpp(){
    $("#opRows").innerHTML=OPP.map(function(n,i){return '<div class="r"><span class="n">'+(i+1)+'</span><input class="pl" value="'+esc(n)+'" data-i="'+i+'" placeholder="اسم لاعب الخصم"><button type="button" class="x" data-d="'+i+'">✕</button></div>'}).join("");
    $$("#opRows input").forEach(function(inp){inp.onchange=function(){OPP[+inp.dataset.i]=inp.value}});
    $$("#opRows [data-d]").forEach(function(b){b.onclick=function(){OPP.splice(+b.dataset.d,1);renderOpp()}});
  }
  function bindGl(){
    $$("#glRows .tm").forEach(function(s){s.onchange=function(){var r=s.closest(".r");var op=s.value==="op";r.querySelector(".g-pid").style.display=op?"none":"";r.querySelector(".g-name").style.display=op?"":"none"}});
    $$("#glRows .x").forEach(function(b){b.onclick=function(){b.closest(".r").remove()}});
  }
  renderLu();renderPitch();renderOpp();bindGl();
  $("#opAdd").onclick=function(){OPP.push("");renderOpp()};
  $("#glAdd").onclick=function(){$("#glRows").insertAdjacentHTML("beforeend",goalRow());bindGl()};
  $("#mX").onclick=closeModal;
  $("#mS").onclick=function(){
    var goals=$$("#glRows .r").map(function(r){var team=r.querySelector(".tm").value;return{team:team,pid:team==="my"?+r.querySelector(".g-pid").value:0,name:team==="op"?r.querySelector(".g-name").value.trim():"",min:+r.querySelector(".mi").value||0}});
    var o={id:i>=0?C.matches[i].id:Date.now(),opponent:$("#mOpp").value.trim(),date:$("#mDate").value,venue:$("#mVenue").value.trim(),comp:$("#mComp").value.trim(),home:$("#mHome").checked,status:$("#mStatus").value,my:+$("#mMy").value||0,op:+$("#mOp").value||0,lineup:XI.slice(),oppLineup:OPP.map(function(s){return String(s).trim()}).filter(Boolean),goals:goals};
    if(!o.opponent||!o.date){toast("❌ أدخل الخصم والتاريخ","err");return}
    if(i>=0)C.matches[i]=o;else C.matches.push(o);
    save();closeModal();renderMatches();
  };
}

/* ===== سجل الشرف ===== */
function honors(){
  $("#content").innerHTML='<div class="sec-head"><h3>سجل الشرف <span class="count">'+C.honors.length+'</span></h3><button class="btn" id="addH">➕ إضافة وسام</button></div><div class="list" id="list"></div>';
  $("#addH").onclick=function(){openHonor(-1)};
  renderHonors();
}
function honorWho(h){
  if(h.kind==="player"){var p=C.players.filter(function(x){return x.id===h.who})[0];return p?p.name:"لاعب محذوف"}
  if(h.kind==="board"){var b=C.board.filter(function(x){return x.id===h.who})[0];return b?b.name+(b.role?" — "+b.role:""):"عضو محذوف"}
  return "الفريق كاملًا";
}
function renderHonors(){
  var groups=[["team","🏆 أوسمة الفريق"],["player","👥 تكريمات اللاعبين"],["board","🧑‍ تكريمات الإدارة"]],h="";
  groups.forEach(function(g){
    var arr=[];C.honors.forEach(function(x,i){if((x.kind||"team")===g[0])arr.push({h:x,i:i})});
    if(!arr.length)return;
    h+='<div style="margin-bottom:6px"><h4 style="font-size:.86rem;color:var(--gold-ink);margin:10px 0 8px">'+g[1]+' ('+arr.length+')</h4>';
    arr.forEach(function(x){
      var o=x.h,ic=o.t==="gold"?"🥇":o.t==="silver"?"🥈":o.t==="bronze"?"🥉":"🏅";
      h+='<div class="it"><div class="it-ic"><span>'+ic+'</span></div>'+
        '<div class="it-bd"><b>'+esc(o.title)+'</b><small>'+esc(honorWho(o))+(o.season?" • "+esc(o.season):"")+'</small>'+
        (o.note?'<div class="it-tags"><span class="tag blue">'+esc(o.note)+'</span></div>':"")+'</div>'+
        '<div class="it-acts"><button class="e" data-e="'+x.i+'">✏️</button><button class="d" data-d="'+x.i+'">🗑️</button></div></div>';
    });
    h+='</div>';
  });
  $("#list").innerHTML=h||'<div class="empty"><i>🏅</i><h3>لا أوسمة بعد</h3><p>أضف أول وسام للفريق أو تكريمًا للاعب أو إداري</p></div>';
  $$("#list [data-e]").forEach(function(b){b.onclick=function(){openHonor(+b.dataset.e)}});
  $$("#list [data-d]").forEach(function(b){b.onclick=function(){if(confirm("حذف الوسام؟")){C.honors.splice(+b.dataset.d,1);save();renderHonors()}}});
}
function openHonor(i){
  var o=i>=0?C.honors[i]:{kind:"team",title:"",who:0,t:"gold",season:"",note:""};
  $("#modalBox").className="modal-box";
  $("#modalBox").innerHTML='<h3>'+(i>=0?"تعديل":"إضافة")+' وسام / تكريم</h3>'+
    '<div class="fld"><label>اسم الوسم أو التكريم</label><input id="hTitle" value="'+esc(o.title)+'" placeholder="مثال: بطل دوري رفاعة / درع التميز الإداري"></div>'+
    '<div class="fld-row"><div class="fld"><label>الجهة المُكرَّمة</label><select id="hKind"><option value="team"'+(o.kind==="team"?" selected":"")+'>🏆 الفريق كاملًا</option><option value="player"'+(o.kind==="player"?" selected":"")+'>👥 لاعب</option><option value="board"'+(o.kind==="board"?" selected":"")+'>🧑‍ عضو إدارة</option></select></div><div class="fld"><label>نوع الوسام</label><select id="hType"><option value="gold"'+(o.t==="gold"?" selected":"")+'>🥇 ذهبي</option><option value="silver"'+(o.t==="silver"?" selected":"")+'>🥈 فضي</option><option value="bronze"'+(o.t==="bronze"?" selected":"")+'>🥉 برونزي</option><option value="medal"'+(o.t==="medal"?" selected":"")+'>🏅 وسام</option></select></div></div>'+
    '<div class="fld" id="hWhoFld"><label>اختر الشخص</label><select id="hWho"></select></div>'+
    '<div class="fld-row"><div class="fld"><label>الموسم / السنة</label><input id="hSeason" value="'+esc(o.season||"")+'" placeholder="مثال: 2026"></div><div class="fld"><label>ملاحظة (اختياري)</label><input id="hNote" value="'+esc(o.note||"")+'" placeholder="مثال: بمناسبة الصعود"></div></div>'+
    '<div class="modal-acts"><button class="btn ghost" id="mX">إلغاء</button><button class="btn" id="mS">💾 حفظ</button></div>';
  $("#modal").classList.add("on");
  function fillWho(){
    var kind=$("#hKind").value;
    if(kind==="team"){$("#hWhoFld").style.display="none";return}
    $("#hWhoFld").style.display="";
    var list=kind==="player"?C.players:C.board;
    $("#hWho").innerHTML=list.map(function(x){return '<option value="'+x.id+'"'+(o.who===x.id?" selected":"")+'>'+esc(x.name)+(kind==="player"?" — #"+esc(x.num):"")+'</option>'}).join("");
  }
  fillWho();
  $("#hKind").onchange=fillWho;
  $("#mX").onclick=closeModal;
  $("#mS").onclick=function(){
    var kind=$("#hKind").value,title=$("#hTitle").value.trim();
    if(!title){toast("❌ أدخل اسم الوسم أو التكريم","err");return}
    var who=0;
    if(kind!=="team"){
      if(!(kind==="player"?C.players:C.board).length){toast(kind==="player"?"❌ أضف لاعبين أولًا":"❌ أضف أعضاء إدارة أولًا","err");return}
      who=+$("#hWho").value||0;
    }
    var obj={id:i>=0?C.honors[i].id:Date.now(),kind:kind,title:title,who:who,t:$("#hType").value,season:$("#hSeason").value.trim(),note:$("#hNote").value.trim()};
    if(i>=0)C.honors[i]=obj;else C.honors.push(obj);
    save();closeModal();renderHonors();
  };
}

/* ===== الرسائل ===== */
function messages(){
  $("#content").innerHTML='<div class="sec-head"><h3>الرسائل الواردة <span class="count">'+C.messages.length+'</span></h3></div>'+
    (C.messages.length?C.messages.map(function(m,i){
      return '<div class="msg'+(m.read?" read":"")+'"><div class="head"><b>'+esc(m.name)+'</b><time>'+new Date(m.created_at||Date.now()).toLocaleString("ar")+'</time></div><p>'+esc(m.body)+'</p><div class="meta"><span>📱 '+esc(m.phone||"—")+'</span><span>📋 '+esc(m.topic||"أخرى")+'</span></div><div class="acts">'+(m.read?"":'<button class="btn sm" data-r="'+i+'">✓ تعليم كمقروءة</button>')+'<button class="btn sm danger" data-d="'+i+'">🗑️ حذف</button></div></div>';
    }).join(""):'<div class="empty"><i>✉️</i><h3>لا رسائل واردة</h3><p>ستظهر هنا رسائل الزوار</p></div>');
  $$("#content [data-r]").forEach(function(b){b.onclick=function(){
    var i=+b.dataset.r,m=C.messages[i];if(!m)return;
    if(MODE==="api"&&m.id!=null){
      fetch(API+"/messages",{method:"PATCH",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:JSON.stringify({id:m.id,read:true})})
        .then(function(r){if(!r.ok)throw 0;m.read=true;messages();toast("✅ تم التعليم كمقروءة","ok")})
        .catch(function(){toast("❌ تعذر الاتصال بالخادم","err")});
    }else{m.read=true;save();messages()}
  }});
  $$("#content [data-d]").forEach(function(b){b.onclick=function(){
    if(!confirm("حذف الرسالة؟"))return;
    var i=+b.dataset.d,m=C.messages[i];if(!m)return;
    if(MODE==="api"&&m.id!=null){
      fetch(API+"/messages",{method:"DELETE",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:JSON.stringify({id:m.id})})
        .then(function(r){if(!r.ok)throw 0;C.messages.splice(i,1);messages();toast("✅ تم الحذف","ok")})
        .catch(function(){toast("❌ تعذر الاتصال بالخادم","err")});
    }else{C.messages.splice(i,1);save();messages()}
  }});
}

/* ===== الإعدادات ===== */
function settings(){
  var s=C.settings;
  $("#content").innerHTML='<div class="set-grid">'+
    '<div class="set-card"><h4>🏟️ بيانات النادي</h4>'+
    '<div class="fld"><label>اسم النادي</label><input id="setName" value="'+esc(s.name)+'"></div>'+
    '<div class="fld"><label>المنطقة</label><input id="setRegion" value="'+esc(s.region)+'"></div>'+
    '<div class="fld"><label>الشعار</label><input id="setMotto" value="'+esc(s.motto)+'"></div>'+
    '<div class="fld"><label>عن النادي</label><textarea id="setAbout">'+esc(s.about||"")+'</textarea></div></div>'+
    '<div class="set-card"><h4>📍 الميدانان (أزرار أسفل الموقع)</h4>'+
    '<div class="fld"><label>اسم الميدان الأول</label><input id="setF1" value="'+esc(s.f1.name)+'"></div>'+
    '<div class="fld"><label>رابط خريطته</label><input id="setF1M" value="'+esc(s.f1.map)+'"></div>'+
    '<div class="fld"><label>اسم الميدان الثاني</label><input id="setF2" value="'+esc(s.f2.name)+'"></div>'+
    '<div class="fld"><label>رابط خريطته</label><input id="setF2M" value="'+esc(s.f2.map)+'"></div></div></div>'+
    '<div class="set-card" style="margin-top:16px"><h4>🎯 التشكيلة الأساسية الثابتة (تظهر في الرئيسية)</h4>'+
    '<p style="color:var(--muted);font-size:.8rem;margin-bottom:12px">اختر 11 لاعبًا — المعاينة تتحدث فورًا على الملعب.</p>'+
    '<div class="lu-editor"><div class="lu-side" id="xiSide"></div><div><div class="pitch-mini"><div class="pitch-mini-in" id="xiPitch"></div></div></div></div></div>'+
    '<div class="set-grid" style="margin-top:16px"><div class="set-card"><h4>🔗 وسائل التواصل</h4>'+
    '<div class="fld"><label>Facebook</label><input id="socFb" value="'+esc(s.social.fb)+'"></div>'+
    '<div class="fld"><label>WhatsApp</label><input id="socWa" value="'+esc(s.social.wa)+'"></div>'+
    '<div class="fld"><label>YouTube</label><input id="socYt" value="'+esc(s.social.yt)+'"></div>'+
    '<div class="fld"><label>Instagram</label><input id="socIg" value="'+esc(s.social.ig)+'"></div>'+
    '<div class="fld"><label>TikTok</label><input id="socTt" value="'+esc(s.social.tt)+'"></div></div>'+
    '<div class="set-card"><h4>🔐 كلمة المرور (الوضع المحلي)</h4>'+
    '<div class="fld"><label>كلمة مرور جديدة</label><input id="newPass" type="password" placeholder="اتركها فارغة للإبقاء على الحالية"></div>'+
    '<p style="color:var(--muted);font-size:.76rem;margin-top:6px">الحالية: <b style="color:var(--gold-ink)">••••••••</b></p></div></div>'+
    '<div style="margin-top:20px;text-align:end"><button class="btn" id="saveS">💾 حفظ كل الإعدادات</button></div>';
  var XI=(s.defaultXI||[]).slice();
  function jerseySvg(num){return '<svg viewBox="0 0 44 38" class="jsy"><path d="M15 3 7 7 2 14l7 4 2-3v16h22V15l2 3 7-4-5-7-8-4c0 4-3 6-6 6s-6-2-6-6z" fill="#f2b84b" stroke="#123024" stroke-width="1.6"/><text x="22" y="28" text-anchor="middle" font-size="12" font-family="Changa" font-weight="800" fill="#123024">'+esc(num)+'</text></svg>'}
  function renderXi(){
    var byPos={};POS.forEach(function(p){byPos[p]=[]});
    C.players.forEach(function(p){if(byPos[p.pos])byPos[p.pos].push(p)});
    var h="";
    POS.forEach(function(pos){
      var cnt=XI.filter(function(id){var p=C.players.filter(function(x){return x.id===id})[0];return p&&p.pos===pos}).length;
      var max=pos==="حارس مرمى"?1:pos==="مدافع"?5:pos==="وسط"?5:3;
      h+='<div class="lu-group"><div class="lu-group-title">'+pos+' <span class="n">'+cnt+'/'+max+'</span></div>';
      byPos[pos].forEach(function(p){
        var inXi=XI.indexOf(p.id)>-1;
        h+='<div class="lu-player'+(inXi?" in":"")+'" data-pid="'+p.id+'" data-pos="'+pos+'" data-max="'+max+'"><span class="num">'+esc(p.num)+'</span><div class="nm"><b>'+esc(p.name)+'</b><small>'+(p.age?p.age+' سنة':'')+'</small></div><span class="x">'+(inXi?"✕":"")+'</span></div>';
      });
      h+='</div>';
    });
    $("#xiSide").innerHTML=h||'<div style="color:var(--dim);text-align:center;padding:20px">أضف اللاعبين أولًا</div>';
    $$("#xiSide .lu-player").forEach(function(el){
      el.onclick=function(){
        var pid=+el.dataset.pid,pos=el.dataset.pos,max=+el.dataset.max;
        var idx=XI.indexOf(pid);
        if(idx>-1)XI.splice(idx,1);
        else{
          var cnt=XI.filter(function(id){var p=C.players.filter(function(x){return x.id===id})[0];return p&&p.pos===pos}).length;
          if(cnt>=max){toast("❌ الحد الأقصى لـ "+pos+" هو "+max,"err");return}
          XI.push(pid);
        }
        renderXi();renderXiPitch();
      };
    });
  }
  function renderXiPitch(){
    var ps=XI.map(function(id){return C.players.filter(function(p){return p.id===id})[0]}).filter(Boolean);
    if(!ps.length){$("#xiPitch").innerHTML='<div class="pm-empty">اختر اللاعبين لرؤية التشكيلة</div>';return}
    var rows=[["مهاجم","r1"],["وسط","r2"],["مدافع","r3"],["حارس مرمى","r4"]].map(function(r){return{cls:r[1],ps:ps.filter(function(p){return p.pos===r[0]})}}).filter(function(r){return r.ps.length});
    $("#xiPitch").innerHTML=rows.map(function(r){
      return '<div class="pm-row '+r.cls+'">'+r.ps.map(function(p){return '<div class="pm-p">'+jerseySvg(p.num)+'<span>'+esc(p.name.split(" ")[0])+'</span></div>'}).join("")+'</div>';
    }).join("");
  }
  renderXi();renderXiPitch();
  $("#saveS").onclick=function(){
    C.settings.name=$("#setName").value.trim();
    C.settings.region=$("#setRegion").value.trim();
    C.settings.motto=$("#setMotto").value.trim();
    C.settings.about=$("#setAbout").value.trim();
    C.settings.f1.name=$("#setF1").value.trim();
    C.settings.f1.map=$("#setF1M").value.trim();
    C.settings.f2.name=$("#setF2").value.trim();
    C.settings.f2.map=$("#setF2M").value.trim();
    C.settings.social.fb=$("#socFb").value.trim();
    C.settings.social.wa=$("#socWa").value.trim();
    C.settings.social.yt=$("#socYt").value.trim();
    C.settings.social.ig=$("#socIg").value.trim();
    C.settings.social.tt=$("#socTt").value.trim();
    C.settings.defaultXI=XI.slice();
    var np=$("#newPass").value;
    if(np.length>=4){localStorage.setItem("wadi_pass",np);toast("✅ تم تحديث كلمة المرور","ok")}
    save();
  };
}

function closeModal(){$("#modal").classList.remove("on");$("#modalBox").className="modal-box"}
$("#modal").onclick=function(e){if(e.target.id==="modal")closeModal()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});

/* بدء التشغيل */
if(TOKEN){
  fetch(API+"/admin",{headers:{"Authorization":"Bearer "+TOKEN}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    C=d.content||DEFAULT();
    normC();
    enter("api",localStorage.getItem("wadi_user")||"admin");
  }).catch(function(){TOKEN="";localStorage.removeItem("wadi_token");/* تظهر شاشة الدخول */});
}
})();
</script>
