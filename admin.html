<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم | وادي التراجمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url("https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap");
:root{
  --bg:#f5f7f5;--srf:#fff;--srf2:#f0f3f0;--txt:#101815;--muted:#57665e;
  --line:rgba(16,24,21,.12);--gold:#f2b84b;--goldD:#b57e1f;--gold-ink:#9a6e00;
  --blue:#2e5bff;--green:#1f8a4c;--red:#c2410c;
  --df:"Changa",sans-serif;--bf:"IBM Plex Sans Arabic",sans-serif;
  --r:16px;--shadow:0 8px 30px rgba(16,24,21,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--bf);background:var(--bg);color:var(--txt);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{font-family:var(--df)}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

/* شاشة الدخول */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--srf);padding:40px;border-radius:var(--r);box-shadow:var(--shadow);width:100%;max-width:400px;text-align:center}
.login-card h1{font-size:1.5rem;margin-bottom:8px}
.login-card p{color:var(--muted);font-size:.88rem;margin-bottom:24px}
.login-card input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px;font-size:.95rem}
.login-card input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,184,75,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--goldD));color:#fff;padding:13px 28px;border-radius:12px;font-family:var(--df);font-weight:700;font-size:.95rem;transition:.2s;box-shadow:0 6px 20px rgba(242,184,75,.3)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn.full{width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-ink)}
.btn.sm{padding:8px 16px;font-size:.82rem}
.btn.danger{background:linear-gradient(135deg,var(--red),#a03008)}
.btn.green{background:linear-gradient(135deg,var(--green),#166a3a)}

/* الهيدر */
.header{background:var(--srf);border-bottom:1px solid var(--line);padding:14px 0;position:sticky;top:0;z-index:50}
.header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.header h2{font-size:1.2rem}
.header .user{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}

/* التخطيط */
.layout{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:24px 0}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;width:100%}}
.sidebar{background:var(--srf);border-radius:var(--r);padding:16px;height:fit-content;position:sticky;top:80px}
.sidebar a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.9rem;margin-bottom:4px;transition:.2s;text-decoration:none}
.sidebar a:hover{background:var(--srf2);color:var(--txt)}
.sidebar a.on{background:linear-gradient(135deg,rgba(242,184,75,.15),rgba(46,91,255,.08));color:var(--gold-ink)}
.sidebar a i{width:24px;height:24px;display:grid;place-items:center;font-style:normal}

.content{background:var(--srf);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.content h3{font-size:1.3rem;margin-bottom:16px}

/* القوائم */
.list{display:grid;gap:12px}
.item{background:var(--srf2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.item .info{flex:1;min-width:150px}
.item .info b{display:block;font-family:var(--df);font-size:.95rem}
.item .info small{color:var(--muted);font-size:.78rem}
.item .actions{display:flex;gap:6px}
.item .actions button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;transition:.2s}
.item .actions .edit{background:rgba(46,91,255,.12);color:var(--blue)}
.item .actions .edit:hover{background:var(--blue);color:#fff}
.item .actions .del{background:rgba(194,65,12,.12);color:var(--red)}
.item .actions .del:hover{background:var(--red);color:#fff}

/* النماذج */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;place-items:center;z-index:100;padding:20px}
.modal.on{display:grid}
.modal-box{background:var(--srf);border-radius:var(--r);width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-box h3{margin-bottom:16px;font-size:1.2rem}
.field{margin-bottom:14px}
.field label{display:block;font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,184,75,.12)}
.field textarea{min-height:100px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.field-row{grid-template-columns:1fr}}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}

/* الإحصائيات */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--srf2);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.stat b{display:block;font-family:var(--df);font-size:1.6rem;color:var(--gold-ink)}
.stat small{color:var(--muted);font-size:.78rem}

/* الجدول */
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th,.tbl td{padding:10px;text-align:center;border-bottom:1px solid var(--line)}
.tbl th{background:var(--srf2);font-weight:700;font-size:.8rem;color:var(--muted)}
.tbl tr:hover{background:rgba(242,184,75,.05)}
.tbl input{width:70px;padding:6px;border:1px solid var(--line);border-radius:6px;text-align:center}
.tbl input:focus{outline:none;border-color:var(--gold)}

/* الرسائل */
.msg{background:var(--srf2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.msg.read{opacity:.6}
.msg .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.msg .head b{font-family:var(--df);font-size:.92rem}
.msg .head time{font-size:.75rem;color:var(--muted)}
.msg p{font-size:.88rem;color:var(--txt)}
.msg .meta{font-size:.78rem;color:var(--muted);margin-top:6px}

/* صور */
.img-preview{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-top:10px;background:var(--srf2)}
.upload-area{border:2px dashed var(--line);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:.2s;background:var(--bg)}
.upload-area:hover{border-color:var(--gold);background:rgba(242,184,75,.05)}
.upload-area input{display:none}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:12px 24px;border-radius:100px;font-size:.88rem;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-5px)}

.empty{text-align:center;padding:40px;color:var(--muted)}
.empty i{font-size:2.5rem;display:block;margin-bottom:10px}

.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.section-head h3{margin:0}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div class="login" id="loginView">
  <div class="login-card">
    <h1>🏟️ وادي التراجمة</h1>
    <p>لوحة تحكم النادي — تسجيل الدخول</p>
    <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username">
    <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password">
    <button class="btn full" onclick="login()">دخول</button>
  </div>
</div>

<!-- لوحة التحكم -->
<div id="appView" style="display:none">
  <header class="header">
    <div class="wrap">
      <h2>⚽ لوحة التحكم</h2>
      <div class="user">
        <span id="userName">admin</span>
        <button class="btn sm ghost" onclick="logout()">خروج</button>
      </div>
    </div>
  </header>
  
  <div class="wrap">
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content" id="content"></main>
    </div>
  </div>
</div>

<!-- المودال -->
<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var API = "/api";
var KEY = "wadi_data_v2";
var TOKEN = localStorage.getItem("wadi_token")||"";
var C = null;
var cur = "dash";

var POS = ["حارس مرمى","مدافع","وسط","مهاجم"];

var SECTIONS = [
  ["dash","📊","لوحة القيادة"],
  ["players","👥","اللاعبون"],
  ["matches","⚽","المباريات"],
  ["standings","🏆","جدول الترتيب"],
  ["news","📰","الأخبار"],
  ["gallery","📸","معرض الصور"],
  ["honors","🏅","سجل الشرف"],
  ["board","🧑‍💼","الإدارة"],
  ["messages","✉️","الرسائل"],
  ["settings","⚙️","الإعدادات"]
];

/* ===== دوال مساعدة ===== */
function $(s){return document.querySelector(s)}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function toast(m){
  var t=$("#toast");t.textContent=m;t.classList.add("on");
  setTimeout(function(){t.classList.remove("on")},3000);
}

function api(path,opts){
  opts = opts||{};
  opts.headers = Object.assign({"Content-Type":"application/json"},opts.headers||{});
  if(TOKEN)opts.headers["Authorization"]="Bearer "+TOKEN;
  return fetch(API+path,opts).then(function(r){
    if(!r.ok)throw new Error("خطأ: "+r.status);
    return r.json();
  });
}

/* ===== الدخول والخروج ===== */
window.login = function(){
  var u=$("#username").value.trim()||"admin";
  var p=$("#password").value;
  api("/login",{method:"POST",body:JSON.stringify({username:u,password:p})})
    .then(function(r){
      TOKEN=r.token;
      localStorage.setItem("wadi_token",TOKEN);
      localStorage.setItem("wadi_user",r.username||u);
      boot();
    })
    .catch(function(){toast("❌ بيانات الدخول خاطئة")});
};

window.logout = function(){
  api("/logout",{method:"POST"}).catch(function(){});
  TOKEN="";localStorage.removeItem("wadi_token");localStorage.removeItem("wadi_user");
  location.reload();
};

/* ===== التمهيد ===== */
function boot(){
  api("/admin").then(function(r){
    C=r.content;
    $("#userName").textContent=r.username||"admin";
    $("#loginView").style.display="none";
    $("#appView").style.display="block";
    buildSidebar();
    go("dash");
  }).catch(function(){
    // في حالة عدم وجود Backend، نستخدم البيانات المحلية
    var local = localStorage.getItem(KEY);
    C = local ? JSON.parse(local) : getDefaultData();
    $("#loginView").style.display="none";
    $("#appView").style.display="block";
    $("#userName").textContent="admin (وضع محلي)";
    buildSidebar();
    go("dash");
  });
}

function getDefaultData(){
  return {
    settings:{name:"وادي التراجمة",region:"ريفي رفاعة",motto:"من قلب الوادي.. نلعب باسم الديار",address:"",phone:"",email:"",about:"",f1:{name:"ميدان الوادي",map:""},f2:{name:"ميدان الهاشماب",map:""},social:{fb:"",wa:"",yt:"",ig:"",tt:""}},
    players:[],matches:[],news:[],standings:[],gallery:[],honors:[],board:[],timeline:[],messages:[]
  };
}

function saveLocal(){
  localStorage.setItem(KEY,JSON.stringify(C));
}

function saveRemote(){
  api("/admin",{method:"POST",body:JSON.stringify(C)})
    .then(function(){toast("✅ تم الحفظ")})
    .catch(function(){saveLocal();toast("✅ تم الحفظ محلياً")});
}

/* ===== الشريط الجانبي ===== */
function buildSidebar(){
  $("#sidebar").innerHTML = SECTIONS.map(function(s){
    return '<a href="#" data-sec="'+s[0]+'"><i>'+s[1]+'</i>'+s[2]+'</a>';
  }).join("");
  $$("#sidebar a").forEach(function(a){
    a.onclick=function(e){e.preventDefault();go(a.dataset.sec)};
  });
}

function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}

function go(sec){
  cur=sec;
  $$("#sidebar a").forEach(function(a){a.classList.toggle("on",a.dataset.sec===sec)});
  var fn={dash:dash,players:players,matches:matches,standings:standings,news:news,gallery:gallery,honors:honors,board:board,messages:messages,settings:settings};
  if(fn[sec])fn[sec]();
}

/* ===== لوحة القيادة ===== */
function dash(){
  var up=C.matches.filter(function(m){return m.status==="upcoming"}).length;
  var fin=C.matches.filter(function(m){return m.status==="finished"});
  var w=fin.filter(function(m){return m.my>m.op}).length;
  var unread=C.messages.filter(function(m){return !m.read}).length;
  
  $("#content").innerHTML = 
    '<h3>📊 لوحة القيادة</h3>'+
    '<div class="stats">'+
    '<div class="stat"><b>'+C.players.length+'</b><small>لاعب</small></div>'+
    '<div class="stat"><b>'+C.matches.length+'</b><small>مباراة</small></div>'+
    '<div class="stat"><b>'+up+'</b><small>قادمة</small></div>'+
    '<div class="stat"><b>'+w+'</b><small>فوز</small></div>'+
    '<div class="stat"><b>'+C.news.length+'</b><small>خبر</small></div>'+
    '<div class="stat"><b>'+C.gallery.length+'</b><small>صورة</small></div>'+
    '<div class="stat"><b>'+(C.standings.length||0)+'</b><small>فريق في الترتيب</small></div>'+
    '<div class="stat"><b>'+unread+'</b><small>رسالة جديدة</small></div>'+
    '</div>'+
    '<div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+
    '<button class="btn" onclick="go(\'players\');openPlayerForm()">➕ إضافة لاعب</button>'+
    '<button class="btn" onclick="go(\'matches\');openMatchForm()">➕ إضافة مباراة</button>'+
    '<button class="btn" onclick="go(\'news\');openNewsForm()">➕ إضافة خبر</button>'+
    '<button class="btn" onclick="go(\'gallery\');openGalleryForm()">➕ إضافة صورة</button>'+
    '</div>';
}

/* ===== اللاعبون ===== */
function players(){
  $("#content").innerHTML = 
    '<div class="section-head"><h3>👥 اللاعبون ('+C.players.length+')</h3><button class="btn" onclick="openPlayerForm()">➕ إضافة</button></div>'+
    '<div class="list" id="list"></div>';
  renderPlayers();
}

function renderPlayers(){
  var list=C.players.map(function(p,i){
    return '<div class="item"><div class="info"><b>#'+esc(p.num)+' '+esc(p.name)+'</b><small>'+esc(p.pos)+(p.age?' • '+p.age+' سنة':'')+' • ⚽ '+(p.goals||0)+' هدف • 🎯 '+(p.assists||0)+' صناعة</small></div><div class="actions"><button class="edit" onclick="openPlayerForm('+i+')">✏️</button><button class="del" onclick="delItem(\'players\','+i+')">🗑️</button></div></div>';
  }).join("");
  $("#list").innerHTML=list||'<div class="empty"><i>👥</i>لا لاعبين بعد</div>';
}

window.openPlayerForm = function(i){
  var p=i!==undefined?C.players[i]:{name:"",num:"",age:"",pos:"مهاجم",goals:0,assists:0,clean:0,apps:0,photo:""};
  $("#modalBox").innerHTML = 
    '<h3>'+(i!==undefined?"تعديل":"إضافة")+' لاعب</h3>'+
    '<div class="field"><label>الاسم</label><input id="pName" value="'+esc(p.name)+'"></div>'+
    '<div class="field-row">'+
    '<div class="field"><label>رقم القميص</label><input id="pNum" type="number" value="'+esc(p.num)+'"></div>'+
    '<div class="field"><label>العمر</label><input id="pAge" type="number" value="'+esc(p.age||"")+'"></div>'+
    '</div>'+
    '<div class="field"><label>الخانة</label><select id="pPos">'+POS.map(function(x){return '<option'+(p.pos===x?' selected':'')+'>'+x+'</option>'}).join("")+'</select></div>'+
    '<div class="field-row">'+
    '<div class="field"><label>أهداف</label><input id="pGoals" type="number" value="'+(p.goals||0)+'"></div>'+
    '<div class="field"><label>صناعة أهداف</label><input id="pAssists" type="number" value="'+(p.assists||0)+'"></div>'+
    '</div>'+
    '<div class="field-row">'+
    '<div class="field"><label>كلين شيت (للحراس)</label><input id="pClean" type="number" value="'+(p.clean||0)+'"></div>'+
    '<div class="field"><label>مباريات</label><input id="pApps" type="number" value="'+(p.apps||0)+'"></div>'+
    '</div>'+
    '<div class="field"><label>رابط الصورة</label><input id="pPhoto" value="'+esc(p.photo)+'" placeholder="https://..."></div>'+
    '<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">إلغاء</button><button class="btn" onclick="savePlayer('+(i!==undefined?i:-1)+')">💾 حفظ</button></div>';
  $("#modal").classList.add("on");
};

window.savePlayer = function(i){
  var p={
    id:i>=0?C.players[i].id:Date.now(),
    name:$("#pName").value.trim(),
    num:+$("#pNum").value||0,
    age:+$("#pAge").value||0,
    pos:$("#pPos").value,
    goals:+$("#pGoals").value||0,
    assists:+$("#pAssists").value||0,
    clean:+$("#pClean").value||0,
    apps:+$("#pApps").value||0,
    photo:$("#pPhoto").value.trim()
  };
  if(!p.name){toast("❌ أدخل الاسم");return}
  if(i>=0)C.players[i]=p;else C.players.push(p);
  saveRemote();closeModal();renderPlayers();toast("✅ تم حفظ اللاعب");
};

/* ===== المباريات ===== */
function matches(){
  $("#content").innerHTML = 
    '<div class="section-head"><h3>⚽ المباريات ('+C.matches.length+')</h3><button class="btn" onclick="openMatchForm()">➕ إضافة</button></div>'+
    '<div class="list" id="list"></div>';
  renderMatches();
}

function renderMatches(){
  var list=C.matches.map(function(m,i){
    var status=m.status==="upcoming"?"🔵 قادمة":(m.my>m.op?"🟢 فوز "+m.my+"-"+m.op:(m.my===m.op?"🟡 تعادل "+m.my+"-"+m.op:"🔴 خسارة "+m.op+"-"+m.my));
    return '<div class="item"><div class="info"><b>'+(m.home?"🏠 ":"✈️ ")+esc(m.opponent)+'</b><small>'+esc(m.comp||"")+' • '+esc(m.venue)+' • '+new Date(m.date).toLocaleDateString("ar")+' — '+status+'</small></div><div class="actions"><button class="edit" onclick="openMatchForm('+i+')">✏️</button><button class="del" onclick="delItem(\'matches\','+i+')">🗑️</button></div></div>';
  }).join("");
  $("#list").innerHTML=list||'<div class="empty"><i>⚽</i>لا مباريات بعد</div>';
}

window.openMatchForm = function(i){
  var m=i!==undefined?C.matches[i]:{opponent:"",date:"",venue:"",comp:"دوري الدرجة الثانية",home:true,status:"upcoming",my:0,op:0,img:""};
  $("#modalBox").innerHTML = 
    '<h3>'+(i!==undefined?"تعديل":"إضافة")+' مباراة</h3>'+
    '<div class="field"><label>الخصم</label><input id="mOpp" value="'+esc(m.opponent)+'"></div>'+
    '<div class="field-row">'+
    '<div class="field"><label>التاريخ والوقت</label><input id="mDate" type="datetime-local" value="'+esc(m.date)+'"></div>'+
    '<div class="field"><label>الملعب</label><input id="mVenue" value="'+esc(m.venue)+'"></div>'+
    '</div>'+
    '<div class="field"><label>البطولة</label><input id="mComp" value="'+esc(m.comp)+'"></div>'+
    '<div class="field"><label>الحالة</label><select id="mStatus"><option value="upcoming"'+(m.status==="upcoming"?' selected':'')+'>قادمة</option><option value="finished"'+(m.status==="finished"?' selected':'')+'>منتهية</option></select></div>'+
    '<div class="field-row">'+
    '<div class="field"><label>أهدافنا</label><input id="mMy" type="number" value="'+(m.my||0)+'"></div>'+

function standings(){

    '<div style="overflow-x:auto"><table class="tbl" id="stbl"><thead><tr><th>الفريق</th><th>لعب</th><th>فوز</th><th>تعادل</th><th>خسارة</th><th>له</th><th>عليه</th><th>نقاط</th><th></th></tr></thead><tbody id="stbody"></tbody></table></div>'+
    '<div style="margin-top:16px;display:flex;gap:10px"><button class="btn green" onclick="saveStandings()">💾 حفظ الترتيب</button><button class="btn ghost" onclick="calcStandings()">🔄 حساب تلقائي من المباريات</button></div>';
  renderStandings();
}

function renderStandings(){
  var sorted=C.standings.slice().sort(function(a,b){
    if(b.pts!==a.pts)return b.pts-a.pts;
    return (b.gf-b.ga)-(a.gf-a.ga);
  });
  $("#stbody").innerHTML = sorted.map(function(t,i){
    var idx=C.standings.indexOf(t);
    var my=t.team===C.settings.name;
    return '<tr'+(my?' style="background:rgba(242,184,75,.1)"':'')+'>'+
    '<td><input value="'+esc(t.team)+'" data-i="'+idx+'" data-f="team" style="width:120px;text-align:start"'+(my?' disabled':'')+'></td>'+
    '<td><input type="number" value="'+t.p+'" data-i="'+idx+'" data-f="p"></td>'+
    '<td><input type="number" value="'+t.w+'" data-i="'+idx+'" data-f="w"></td>'+
    '<td><input type="number" value="'+t.d+'" data-i="'+idx+'" data-f="d"></td>'+
    '<td><input type="number" value="'+t.l+'" data-i="'+idx+'" data-f="l"></td>'+
    '<td><input type="number" value="'+t.gf+'" data-i="'+idx+'" data-f="gf"></td>'+
    '<td><input type="number" value="'+t.ga+'" data-i="'+idx+'" data-f="ga"></td>'+
    '<td><input type="number" value="'+t.pts+'" data-i="'+idx+'" data-f="pts" style="font-weight:bold"></td>'+
    '<td><button class="del" onclick="delStanding('+idx+')" style="width:28px;height:28px;border-radius:6px;background:rgba(194,65,12,.1);color:var(--red)">🗑️</button></td></tr>';
  }).join("");
  
  $$("#stbody input").forEach(function(inp){
    inp.onchange=function(){
      var i=+inp.dataset.i,f=inp.dataset.f;
      C.standings[i][f]=f==="team"?inp.value:+inp.value||0;
      if(f!=="pts"&&f!=="team"){
        var t=C.standings[i];
        t.pts=t.w*3+t.d;
      }
      renderStandings();
    };
  });
}

    pts:(+$("#sW").value||0)*3+(+$("#sD").value||0)
  };
  if(!t.team){toast("❌ أدخل اسم الفريق");return}

window.calcStandings = function(){
  if(!confirm("سيتم إعادة حساب الترتيب من نتائج المباريات المسجلة. متابعة؟"))return;
  var teams={};
  C.standings.forEach(function(t){
    teams[t.team]={team:t.team,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  });
  C.matches.filter(function(m){return m.status==="finished"}).forEach(function(m){
    var myName=C.settings.name;
    var oppName=m.opponent;
    if(!teams[myName])teams[myName]={team:myName,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
    if(!teams[oppName])teams[oppName]={team:oppName,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
    
    var my=m.home?m.my:m.op;
    var op=m.home?m.op:m.my;
    
    teams[myName].p++;teams[oppName].p++;
    teams[myName].gf+=my;teams[myName].ga+=op;
    teams[oppName].gf+=op;teams[oppName].ga+=my;
    
    if(my>op){teams[myName].w++;teams[myName].pts+=3;teams[oppName].l++;}
    else if(my===op){teams[myName].d++;teams[oppName].d++;teams[myName].pts++;teams[oppName].pts++;}
    else{teams[oppName].w++;teams[oppName].pts+=3;teams[myName].l++;}
  });
  C.standings=Object.values(teams);
  saveRemote();renderStandings();toast("✅ تم الحساب التلقائي");
};

  C.settings.social.wa=$("#socWa").value.trim();

  C.settings.social.ig=$("#socIg").value.trim();
  C.settings.social.tt=$("#socTt").value.trim();
  saveRemote();toast("✅ تم حفظ الإعدادات");
};

/* ===== دوال عامة ===== */
window.delItem = function(key,i){
  if(confirm("تأكيد الحذف؟")){
    C[key].splice(i,1);
    saveRemote();
    if(key==="players")renderPlayers();
    else if(key==="matches")renderMatches();
    else if(key==="news")renderNews();
    else if(key==="honors")renderHonors();
    else if(key==="board")renderBoard();
    toast("🗑️ تم الحذف");
  }
};

window.closeModal = function(){$("#modal").classList.remove("on")};
window.go = go;

$("#modal").onclick=function(e){if(e.target.id==="modal")closeModal()};

/* بدء التشغيل */
if(TOKEN)boot();
else $("#loginView").style.display="grid";

})();
</script>
</body>
</html>
